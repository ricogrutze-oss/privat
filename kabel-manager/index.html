<!DOCTYPE html>
<html lang="de">
<head>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Adern">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kabel-Manager Pro V22</title>
    <style>
        :root { --primary: var(--tb-panel); --accent: var(--tb-acc); --bg: var(--tb-bg); --panel: var(--tb-panel); --edge: var(--tb-edge); --text: var(--tb-text); --text-dim: var(--tb-dim); }
        
        /* Zwingt Browser zum Farbdruck */
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--text); font-size: 13px; }
        .tabs { display: flex; background: var(--primary); border-bottom: 1px solid var(--edge); position: sticky; top: 0; z-index: 1000; }
        .tab { padding: 12px 5px; flex: 1; text-align: center; color: var(--text-dim); cursor: pointer; font-weight: bold; border-bottom: 4px solid transparent; }
        .tab.active { border-bottom-color: var(--accent); background: color-mix(in srgb,var(--tb-acc) 8%,transparent); color: var(--text); }
        .container { padding: 10px; }
        .card { background: var(--panel); padding: 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.4); margin-bottom: 15px; border: 1px solid var(--edge); }
        
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { border: 1px solid var(--edge); padding: 6px 2px; text-align: left; color: var(--text); }
        th { background: var(--tb-panel2); font-size: 11px; color: var(--text-dim); }
        
        .col-p { width: 30px; text-align: center; font-weight: bold; }
        .col-wire { width: 75px; } /* Platz für Farbe + Kürzel */

        .wire { 
            width: 28px; height: 14px; border: 1px solid #000; border-radius: 2px; 
            position: relative; display: inline-block; vertical-align: middle; margin-right: 4px;
        }
        .ring { position: absolute; background: #000; height: 100%; width: 2.5px; z-index: 2; }
        .r-b { left: 45%; } 
        .r-c1 { left: 15%; box-shadow: 10px 0 #000; } 
        .r-d1 { left: 30%; box-shadow: 5px 0 #000; }

        .f-txt { font-size: 11px; font-weight: bold; vertical-align: middle; }

        input { width: 95%; padding: 6px; border: 1px solid var(--edge); border-radius: 4px; font-size: 13px; background: var(--tb-inset); color: var(--text); }
        .btn-pdf { background: var(--accent); color: var(--tb-on-acc); padding: 12px; border: none; border-radius: 5px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }

        @media print { 
            .no-print, .tabs, button { display: none !important; } 
            .container { padding: 0; }
            body { background: #fff; color: #000; }
            .card { background:#fff; box-shadow: none; border: 1.5px solid #000; page-break-inside: avoid; margin-bottom: 25px; }
            th, td { color: #000; border-color: #000; }
            input { border: none !important; background: transparent !important; color: black; font-weight: bold; }
            .tab-panel { display: block !important; }
        }
    </style>
<style id="tb-tokens">
:root{--tb-bg:#000000;--tb-panel:#1c1c1e;--tb-panel2:#2c2c2e;--tb-inset:#121214;--tb-seg:#3a3a3c;--tb-toggle:#39393d;--tb-edge:#38383a;--tb-edge2:#48484a;--tb-acc:#8cc63f;--tb-acc-hi:#9fd652;--tb-acc-dim:#6f9c2e;--tb-on-acc:#0b1a02;--tb-text:#f5f5f7;--tb-dim:#98989f;--tb-green:#30d158;--tb-red:#ff453a;--tb-blue:#64a8ff;--tb-orange:#ff9f0a;--tb-purple:#bf8cff;--tb-cyan:#5ac8fa;color-scheme:dark;--tb-acc-bg:color-mix(in srgb,var(--tb-acc) 16%,var(--tb-panel));--tb-red-bg:color-mix(in srgb,var(--tb-red) 16%,var(--tb-panel));--tb-green-bg:color-mix(in srgb,var(--tb-green) 16%,var(--tb-panel));--tb-blue-bg:color-mix(in srgb,var(--tb-blue) 16%,var(--tb-panel));--tb-orange-bg:color-mix(in srgb,var(--tb-orange) 16%,var(--tb-panel));--tb-purple-bg:color-mix(in srgb,var(--tb-purple) 16%,var(--tb-panel));--tb-cyan-bg:color-mix(in srgb,var(--tb-cyan) 16%,var(--tb-panel));}
:root[data-theme="light"]{--tb-bg:#f2f2f7;--tb-panel:#ffffff;--tb-panel2:#eeeef3;--tb-inset:#f2f2f7;--tb-seg:#ffffff;--tb-toggle:#e5e5ea;--tb-edge:#d8d8de;--tb-edge2:#c6c6cc;--tb-acc:#6ba31a;--tb-acc-hi:#5d9111;--tb-acc-dim:#4d7a12;--tb-on-acc:#ffffff;--tb-text:#1c1c1e;--tb-dim:#6c6c70;--tb-green:#1f9d46;--tb-red:#d70015;--tb-blue:#0a64d8;--tb-orange:#c76a00;--tb-purple:#7a3fd0;--tb-cyan:#0a7ea4;color-scheme:light}
body{-webkit-font-smoothing:antialiased}
button:not(:disabled):active{opacity:.85}
@media print{#tb-theme-btn{display:none!important}}
</style>
<script id="tb-theme-js">
(function(){
  var K='toolbox-theme', root=document.documentElement, mq=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):null;
  function mode(){try{var m=localStorage.getItem(K);return (m==='light'||m==='dark')?m:'auto'}catch(e){return 'auto'}}
  function eff(m){return m==='auto'?((mq&&mq.matches)?'light':'dark'):m}
  var ICON={auto:'◐',light:'☀︎',dark:'☾'}, NAME={auto:'Automatisch',light:'Hell',dark:'Dunkel'};
  function apply(){
    var m=mode(), e=eff(m);
    root.setAttribute('data-theme',e);
    if(root.hasAttribute('data-bs-theme')||window.bootstrap) root.setAttribute('data-bs-theme',e);
    var t=document.querySelector('meta[name="theme-color"]'); if(!t){t=document.createElement('meta');t.name='theme-color';document.head.appendChild(t)}
    t.content=e==='light'?'#f2f2f7':'#000000';
    var b=document.getElementById('tb-theme-btn'); if(b){b.textContent=ICON[m];b.title='Darstellung: '+NAME[m]+' (tippen zum Wechseln)';b.setAttribute('aria-label',b.title)}
    try{window.dispatchEvent(new CustomEvent('toolbox-theme',{detail:e}))}catch(x){}
  }
  function set(m){try{if(m==='auto')localStorage.removeItem(K);else localStorage.setItem(K,m)}catch(e){} apply()}
  function cycle(){var m=mode();set(m==='auto'?'light':m==='light'?'dark':'auto')}
  window.toolboxTheme={mode:mode,set:set,cycle:cycle,effective:function(){return eff(mode())}};
  apply();
  if(mq){(mq.addEventListener?mq.addEventListener('change',apply):mq.addListener(apply))}
  window.addEventListener('storage',function(e){if(e.key===K||e.key===null)apply()});
  function btn(){
    if(window.top!==window.self||document.getElementById('tb-theme-btn')||!document.body)return;
    var s=document.createElement('style');
    s.textContent='#tb-theme-btn{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:2147483000;width:38px;height:38px;border-radius:50%;border:.5px solid var(--tb-edge);background:var(--tb-panel2);color:var(--tb-text);font:18px/1 -apple-system,system-ui,sans-serif;padding:0;cursor:pointer;opacity:.88;box-shadow:0 2px 10px rgba(0,0,0,.3);-webkit-tap-highlight-color:transparent}#tb-theme-btn:active{transform:scale(.94)}';
    document.head.appendChild(s);
    var b=document.createElement('button');b.id='tb-theme-btn';b.type='button';b.addEventListener('click',cycle);document.body.appendChild(b);apply();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',btn);else btn();
})();
</script>
</head>
<body>

<div class="tabs no-print">
    <div class="tab active" id="t1" onclick="showTab('planer')">1. Planer</div>
    <div class="tab" id="t2" onclick="showTab('vergleich')">2. Vergleich</div>
</div>

<div class="container">
    <div id="planer" class="tab-panel active">
        <div class="card no-print">
            <strong>Kabel-Planer</strong>
            <div style="display:flex; gap:8px; margin-top: 8px;">
                <select id="sizeSel" style="flex:1">
                    <option value="2">2 DA</option><option value="4">4 DA</option>
                    <option value="6">6 DA</option><option value="8">8 DA</option>
                    <option value="10" selected>10 DA</option><option value="20">20 DA</option>
                </select>
                <button onclick="addKabel()" style="flex:1; background:var(--accent); color:var(--tb-on-acc); border:none; border-radius:5px; font-weight:bold;">+ Neu</button>
            </div>
            <button class="btn-pdf" onclick="window.print()">📄 ALS FARB-PDF SPEICHERN</button>
        </div>
        <div id="kabelListe"></div>
    </div>

    <div id="vergleich" class="tab-panel" style="display:none;">
        <div class="card">
            <h3>Farb-Vergleich (rt/bl vs. Sternvierer)</h3>
            <table>
                <thead>
                    <tr><th class="col-p">P</th><th>Lagen (Bild 1)</th><th>Sternvierer (Bild 3)</th></tr>
                </thead>
                <tbody id="compareBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const farbenLagen = [
        {a:"#FF0000", b:"#0000FF", tA:"rt", tB:"bl"}, {a:"#FFFFFF", b:"#FFFF00", tA:"ws", tB:"ge"},
        {a:"#FFFFFF", b:"#00AA00", tA:"ws", tB:"gn"}, {a:"#FFFFFF", b:"#8B4513", tA:"ws", tB:"br"},
        {a:"#FFFFFF", b:"#000000", tA:"ws", tB:"sw"}, {a:"#FFFFFF", b:"#0000FF", tA:"ws", tB:"bl"},
        {a:"#FFFFFF", b:"#FFFF00", tA:"ws", tB:"ge"}, {a:"#FFFFFF", b:"#00AA00", tA:"ws", tB:"gn"},
        {a:"#FFFFFF", b:"#8B4513", tA:"ws", tB:"br"}, {a:"#FF0000", b:"#000000", tA:"rt", tB:"sw"}
    ];

    let daten = JSON.parse(localStorage.getItem('kabelV22')) || [];

    function showTab(id) {
        document.getElementById('planer').style.display = id === 'planer' ? 'block' : 'none';
        document.getElementById('vergleich').style.display = id === 'vergleich' ? 'block' : 'none';
        document.getElementById('t1').classList.toggle('active', id==='planer');
        document.getElementById('t2').classList.toggle('active', id==='vergleich');
        if(id === 'vergleich') renderVergleich();
    }

    function addKabel() {
        const s = parseInt(document.getElementById('sizeSel').value);
        daten.push({ id:Date.now(), name:"Kabel "+(daten.length+1), size:s, rows:Array(s).fill().map(()=>({a:"",b:""})) });
        save(); render();
    }

    function render() {
        const list = document.getElementById('kabelListe'); list.innerHTML = "";
        daten.forEach((k, ci) => {
            let h = `<div class="card">
                <input type="text" value="${k.name}" onchange="daten[${ci}].name=this.value;save()" style="font-weight:bold; font-size:15px; margin-bottom:10px; border:none; border-bottom:1px solid #ddd;">
                <table><thead><tr><th class="col-p">P</th><th class="col-wire">Farbe</th><th>Beschriftung</th></tr></thead><tbody>`;
            for(let i=0; i<k.size; i++){
                let f = farbenLagen[i % 10];
                h += `<tr><td rowspan="2" class="col-p">${i+1}</td>
                    <td class="col-wire"><div class="wire" style="background-color:${f.a} !important;"></div><span class="f-txt">${f.tA}</span></td>
                    <td><input type="text" value="${k.rows[i].a || ''}" onchange="daten[${ci}].rows[${i}].a=this.value;save()"></td></tr>
                    <tr><td class="col-wire"><div class="wire" style="background-color:${f.b} !important;"></div><span class="f-txt">${f.tB}</span></td>
                    <td><input type="text" value="${k.rows[i].b || ''}" onchange="daten[${ci}].rows[${i}].b=this.value;save()"></td></tr>`;
            }
            list.innerHTML += h + `</tbody></table><button class="no-print" onclick="daten.splice(${ci},1);save();render()" style="margin-top:10px; color:red; border:none; background:none;">Löschen</button></div>`;
        });
    }

    function renderVergleich() {
        const body = document.getElementById('compareBody'); body.innerHTML = "";
        const sColors = ["#FF0000", "#00AA00", "#808080", "#FFFF00", "#FFFFFF"];
        const sNames = ["rt", "gn", "gr", "ge", "ws"];
        for(let i=0; i<20; i++) {
            let fL = farbenLagen[i % 10];
            let cV = sColors[Math.floor((i % 10) / 2)];
            let tV = sNames[Math.floor((i % 10) / 2)];
            let ring = "";
            if(i%2===1 && Math.floor(i/2)%2===0) ring = '<div class="ring r-b"></div>';
            if(i%2===0 && Math.floor(i/2)%2===1) ring = '<div class="ring r-c1"></div>';
            if(i%2===1 && Math.floor(i/2)%2===1) ring = '<div class="ring r-d1"></div>';
            body.innerHTML += `<tr><td class="col-p">${i+1}</td>
                <td><div class="wire" style="background-color:${fL.a} !important;"></div>${fL.tA} / <div class="wire" style="background-color:${fL.b} !important;"></div>${fL.tB}</td>
                <td><div class="wire" style="background-color:${cV} !important;"></div>${tV} / <div class="wire" style="background-color:${cV} !important;">${ring}</div>${tV}</td></tr>`;
        }
    }

    function save() { localStorage.setItem('kabelV22', JSON.stringify(daten)); }
    render();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(function(){});});}</script>
</body>
</html>
